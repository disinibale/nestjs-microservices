# .k8s/overlays/production/kustomization.yml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: auth.service.patch.yml
    target:
      kind: Deployment
      name: auth-service-deployment
  - path: billing.service.patch.yml
    target:
      kind: Deployment
      name: billing-service-deployment
